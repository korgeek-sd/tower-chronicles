<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>RE:BOOT EARTH</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#172520;color:#e6f4d5;font:16px system-ui,sans-serif;text-align:center}main{padding:24px}h1{font-size:32px}progress{width:min(70vw,300px);accent-color:#b6e583}button{padding:12px 24px}</style></head><body><main><h1>RE:BOOT EARTH</h1><p id="status">게임을 불러오는 중입니다.</p><progress id="p" max="18" value="0"></progress><p id="err"></p></main><script>(async()=>{let n=0;try{const parts=await Promise.all(Array.from({length:18},async(_,i)=>{const r=await fetch(new URL('part-'+String(i).padStart(2,'0')+'.txt',location.href));if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text();document.getElementById('p').value=++n;return t}));const html=parts.join('');if(!html.startsWith('<!doctype html>')||!html.trimEnd().endsWith('</html>'))throw new Error('Invalid game data');document.open();document.write(html);document.close()}catch(e){document.getElementById('status').textContent='게임을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.';const b=document.createElement('button');b.textContent='다시 시도';b.onclick=()=>location.reload();document.querySelector('main').append(b)}})();</script></body></html>
