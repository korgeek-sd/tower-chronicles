name: Build Android APK

on:
  push:
    branches:
      - main
      - 'codex/android-capacitor-*'
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'scripts/configure-android.mjs'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write # Initial Android branch lockfile sync; no production credentials are used.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Confirm hosted Android SDK
        run: test -d "${ANDROID_HOME}" && test -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

      - name: Create locked Capacitor dependency graph
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Save generated lockfile to Android integration branch
        if: startsWith(github.ref, 'refs/heads/codex/android-capacitor-')
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build(android): lock Capacitor dependencies"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify web app
        run: |
          npm run typecheck
          node --test tests/androidPackaging.test.mjs
          # Full regression suite remains enforced by Tower Chronicles CI.

      - name: Build bundled offline web assets
        env:
          VITE_SUPABASE_URL: https://zecdhceihrdwdkdykxhx.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_bjJQ-qJg2eB6w88-QHS-vg_68OVgFK7
        run: npm run build

      - name: Generate native Android project
        run: npx cap add android

      - name: Configure optional Firebase messaging
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          else
            echo "Firebase is not configured; Android notifications require a Firebase project."
          fi

      - name: Sync native Android plugins
        run: |
          npx cap sync android
          node scripts/configure-android.mjs

      - name: Harden Gradle distribution download
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          properties = Path("gradle/wrapper/gradle-wrapper.properties")
          source = properties.read_text()
          assert "distributionUrl=" in source, "Missing Gradle wrapper distribution"
          # The binary-only distribution is much smaller and contains the same runtime.
          source = source.replace("-all.zip", "-bin.zip")
          # GitHub Releases currently returns 504 for Gradle distributions.
          # Use the independent NJU mirror with the SHA-256 from gradle.org.
          # The fallback mirror below is checked against the same upstream hash.
          source = source.replace("services.gradle.org/distributions/", "mirror.nju.edu.cn/gradle/")
          source = source.replace("downloads.gradle.org/distributions/", "mirror.nju.edu.cn/gradle/")
          checksum = "bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531"
          lines = [line for line in source.splitlines() if not line.startswith(("networkTimeout=", "retries=", "retryBackOffMs=", "distributionSha256Sum="))]
          lines.extend(("networkTimeout=120000", "retries=3", "retryBackOffMs=3000", f"distributionSha256Sum={checksum}"))
          properties.write_text("\n".join(lines) + "\n")
          print("Updated Gradle wrapper download configuration")
          PY

      - name: Compile installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Gradle build failed after three attempts"
              exit 1
            fi
            if [ "$attempt" -eq 1 ]; then
              # Switch away from the first independent mirror if it is unavailable.
              sed -i 's@mirror.nju.edu.cn/gradle/@mirror.spaceport.work/gradle/@' gradle/wrapper/gradle-wrapper.properties
              echo "Switching to second SHA-256-verified Gradle mirror"
            fi
            echo "Transient Gradle/download failure; retrying attempt $((attempt + 1))"
            sleep $((attempt * 12))
          done

      - name: Check output
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: tower-chronicles-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
