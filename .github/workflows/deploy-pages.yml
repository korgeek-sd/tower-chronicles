name: Deploy Tower Chronicles to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  security:
    uses: ./.github/workflows/security-checks.yml
    permissions:
      contents: read
  build:
    permissions:
      contents: read
      pages: read
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js 22.20
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm test

      - name: Build
        env:
          VITE_SUPABASE_URL: https://zecdhceihrdwdkdykxhx.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_bjJQ-qJg2eB6w88-QHS-vg_68OVgFK7
        run: npm run build

      - name: Verify artwork is included in deploy bundle
        run: |
          test -s dist/assets/monsters/new/plains/grave_digger_hound.png
          test -s dist/assets/characters/preview/grave_hound_job_reference.jpg
          file dist/assets/monsters/new/plains/grave_digger_hound.png dist/assets/characters/preview/grave_hound_job_reference.jpg
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5