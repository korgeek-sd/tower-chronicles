name: Build summon sprites (60-frame cracks and dissolve)

on:
  push:
    branches: [main]
    paths:
      - scripts/assets/buildSealCracks24.py
      - scripts/assets/buildSealDestruction24.py
      - scripts/assets/buildSealCracks60.py
      - scripts/assets/buildSealDissolve60.py
      - .github/workflows/build-seal-cracks-24.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current approved game assets
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install "Pillow>=11,<13"
      - name: Generate crack and destruction atlases
        run: |
          python scripts/assets/buildSealCracks24.py
          python scripts/assets/buildSealDestruction24.py
          python scripts/assets/buildSealCracks60.py
          python scripts/assets/buildSealDissolve60.py
      - name: Validate sprite layout and pixel alpha
        run: |
          python - <<'PY'
          from PIL import Image
          import json
          root='public/assets/vfx/summon/'
          for prefix in ('seal-stone-cracks-v4-24f','seal-stone-destruction-v1-24f'):
              meta=json.load(open(root+prefix+'.json'))
              assert meta['frameCount']==24
              assert meta['columns']==6 and meta['rows']==4
              assert meta['cellSize']==384
              assert len(meta['frames'])==24
              with Image.open(root+prefix+'.webp') as im:
                  assert im.mode=='RGBA'
                  assert im.size==(2304,1536)
                  assert all(im.crop((f['x'],f['y'],f['x']+384,f['y']+384)).getchannel('A').getbbox() for f in meta['frames'])
          base=root+'seal-stone-cracks-v5-60f'
          m=json.load(open(base+'.json'))
          assert m['frameCount']==60 and len(m['frames'])==60
          assert m['columns']==10 and m['rows']==6 and m['cellSize']==256
          with Image.open(base+'.webp') as im:
              assert im.mode=='RGBA'
              assert im.size==(2560,1536)
              assert all(im.crop((f['x'],f['y'],f['x']+256,f['y']+256)).getchannel('A').getbbox() for f in m['frames'])
          base=root+'seal-stone-dissolve-v1-60f'
          m=json.load(open(base+'.json'))
          assert m['effect']=='crumble_dissolve'
          assert m['frameCount']==60 and len(m['frames'])==60
          assert m['columns']==10 and m['rows']==6 and m['cellSize']==256
          with Image.open(base+'.webp') as im:
              assert im.mode=='RGBA' and im.size==(2560,1536)
              assert im.crop((0,0,256,256)).getchannel('A').getbbox()
              assert im.crop((9*256,5*256,10*256,6*256)).getchannel('A').getbbox() is None
          PY
      - name: Commit generated sprite assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/vfx/summon/seal-stone-cracks-v4-24f.webp public/assets/vfx/summon/seal-stone-cracks-v4-24f.json
          git add public/assets/vfx/summon/seal-stone-destruction-v1-24f.webp public/assets/vfx/summon/seal-stone-destruction-v1-24f.json
          git add public/assets/vfx/summon/seal-stone-cracks-v5-60f.webp public/assets/vfx/summon/seal-stone-cracks-v5-60f.json
          git add public/assets/vfx/summon/seal-stone-dissolve-v1-60f.webp public/assets/vfx/summon/seal-stone-dissolve-v1-60f.json
          if ! git diff --cached --quiet; then
            git commit -m "assets: build 60-frame crumbling summon seal atlas"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
