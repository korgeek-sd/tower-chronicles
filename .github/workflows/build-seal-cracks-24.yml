name: Build 24-frame seal crack sprite sheet

on:
  push:
    branches: [main]
    paths:
      - scripts/assets/buildSealCracks24.py
      - .github/workflows/build-seal-cracks-24.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current game assets
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install "Pillow>=11,<13"
      - name: Generate sprite sheet from game source art
        run: python scripts/assets/buildSealCracks24.py
      - name: Check generated frame count and registration
        run: |
          python - <<'PY'
          from PIL import Image
          import json
          base='public/assets/vfx/summon/seal-stone-cracks-v4-24f'
          meta=json.load(open(base+'.json'))
          assert meta['frameCount']==24
          assert meta['addedIntermediateFrames']==10
          assert len(meta['frames'])==24
          with Image.open(base+'.webp') as im:
              assert im.size==(2304,1536)
              assert all(im.crop((f['x'],f['y'],f['x']+384,f['y']+384)).getchannel('A').getbbox() for f in meta['frames'])
          PY
      - name: Commit only generated sprite assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/vfx/summon/seal-stone-cracks-v4-24f.webp public/assets/vfx/summon/seal-stone-cracks-v4-24f.json
          if ! git diff --cached --quiet; then
            git commit -m "assets: generate 24-frame seal crack atlas"
            git push origin HEAD:main
          fi
