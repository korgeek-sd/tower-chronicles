name: Guild Material Warehouse UI quick checks

on:
  push:
    branches:
      - 'codex/**'
    paths:
      - 'src/components/association/GuildMaterialsPanel.tsx'
      - 'src/components/association/AssociationWarehousePanel.tsx'
      - 'src/components/association/guildMaterialsConcept.css'
      - 'tests/guildMaterialsConceptOne.test.ts'
      - '.github/workflows/guild-materials-quick.yml'
  pull_request:
    paths:
      - 'src/components/association/GuildMaterialsPanel.tsx'
      - 'src/components/association/AssociationWarehousePanel.tsx'
      - 'src/components/association/guildMaterialsConcept.css'
      - 'tests/guildMaterialsConceptOne.test.ts'
      - '.github/workflows/guild-materials-quick.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  material-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - name: Install
        run: npm ci
      - name: Material warehouse UI regressions
        run: node --import ./tests/register.mjs --test tests/guildMaterialsConceptOne.test.ts tests/associationTreasuryLedgerUi.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
