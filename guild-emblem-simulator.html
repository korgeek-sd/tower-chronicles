<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>탑의 기록 | 원정단 문장 실험실</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d13;color:#ded4bd;font-family:"Malgun Gothic",system-ui,sans-serif}.shell{max-width:520px;min-height:100vh;margin:auto;background:linear-gradient(#19222e,#11161e 400px,#151a21);box-shadow:0 0 70px #000}header{display:flex;justify-content:space-between;align-items:center;padding:18px 18px 10px;border-bottom:1px solid #5f4d32}h1{margin:0;font-family:serif;font-size:27px;color:#eed59a;letter-spacing:2px}small,.sub{color:#a6a196}.back{background:#252a33;border:1px solid #8e754b;color:#ebce91;border-radius:5px;padding:9px 13px}.sub{text-align:center;font-size:12px;padding:13px}.stage{padding:12px 14px 0}.preview{min-height:250px;border:1px solid #665338;background:radial-gradient(ellipse at center,#2c3644,#171e29 65%);position:relative;overflow:hidden;text-align:center}.preview:before,.preview:after{content:"⚜";font-size:60px;color:#695535;position:absolute;top:70px;opacity:.5}.preview:before{left:18px}.preview:after{right:18px}#crest{width:196px;height:196px;display:block;margin:4px auto -6px;image-rendering:pixelated}#previewName{font-size:20px;color:#f6dfab;font-weight:700;padding:8px}.nameblock{display:flex;align-items:center;gap:10px;margin:15px 0}.nameblock label{white-space:nowrap;color:#e1c899;font-weight:bold;font-size:13px}.nameblock input{background:#111820;border:1px solid #756041;border-radius:4px;color:#f3e8d3;padding:12px;min-width:0;flex:1;font-size:16px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.tab{background:#222831;color:#b5ac9b;border:1px solid #4b5059;padding:13px 1px;font-weight:bold;cursor:pointer}.tab.active{background:#735b36;border-color:#e6bf76;color:#fff0c8}.editor{background:#1b2029;border:1px solid #554a37;padding:14px 12px 20px;min-height:267px}.edtitle{font-size:13px;color:#e4c88e;margin:0 0 14px}.options{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.option{background:#292f38;border:1px solid #50535a;min-height:77px;border-radius:3px;color:#d8c9a7;cursor:pointer;padding:9px 3px}.option .glyph{display:block;font-size:28px;height:39px;line-height:38px}.option span:last-child{font-size:12px}.option.active{background:#514330;border-color:#eccb81;box-shadow:inset 0 0 0 1px #e9c17a}.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:9px;margin:10px 0 20px}.swatch{border:2px solid #42474d;height:35px;border-radius:3px;cursor:pointer}.swatch.active{border:3px solid #ffe4a0;outline:1px solid #fff}.footer{display:flex;gap:12px;padding:16px 14px 22px}.footer button{padding:15px 4px;border-radius:5px;font-size:15px;font-weight:800;cursor:pointer}.secondary{width:36%;background:#343944;border:1px solid #8c8c93;color:#efeadb}.primary{flex:1;background:linear-gradient(#e3c27c,#b98c45);color:#25190c;border:1px solid #ffda93}.notice{margin:0;padding:0 16px 24px;text-align:center;color:#98999a;font-size:12px}#result{display:none;background:#1e252e;border:1px solid #a68b58;margin:0 14px 14px;padding:16px;text-align:center;line-height:1.8}#result button{background:#3b4450;color:white;padding:7px 15px;border:1px solid #8e774e}button:focus-visible,input:focus-visible{outline:2px solid #edc77e}@media(max-width:350px){h1{font-size:22px}.option{min-height:69px}}
</style></head><body><div class="shell"><header><button class="back" onclick="location.href='index.html'">‹</button><h1>원정단 창설</h1><button class="back" onclick="alert('문장 제작 실험용 화면입니다. 실제 원정단이 생성되지 않습니다.')">?</button></header><div class="sub">원정단의 이름과 문장을 직접 정하세요.</div><main class="stage"><div class="preview"><canvas id="crest" width="128" height="128"></canvas><div id="previewName">검은 새벽</div></div><div class="nameblock"><label for="guildName">원정단 이름</label><input id="guildName" maxlength="12" value="검은 새벽"></div><div class="tabs" id="tabs"></div><section class="editor"><p class="edtitle" id="edtitle"></p><div id="choices"></div></section></main><div class="footer"><button class="secondary" id="reset">↻ 초기화</button><button class="primary" id="create">⚑ 원정단 창설</button></div><div id="result"></div><p class="notice">독립 실험 페이지 · 실제 게임 계정과 서버에는 저장되지 않습니다.</p></div><script>
const shapes=[["shield","기사형","⬟"],["round","원형","◉"],["point","첨두형","♢"],["diamond","마름모","◆"],["banner","깃발형","⚑"],["wide","장식형","⬡"],["tower","탑형","♜"],["crest","왕실형","♛"]];
const symbols=[["swords","쌍검","⚔"],["crown","왕관","♛"],["tower","탑","♜"],["star","별","✦"],["moon","달","☾"],["flame","불꽃","♨"],["skull","해골","☠"],["tree","나무","♣"],["wing","날개","❖"],["cross","십자","✚"],["sun","태양","☼"],["gem","보석","◆"]];
const patterns=[["solid","단색","■"],["split","세로분할","◧"],["horizontal","가로분할","⬒"],["diagonal","대각선","◩"],["cross","십자","✚"],["chevron","V자","∨"],["quarters","사분할","▦"],["stripe","줄무늬","▥"]];
const colors=["#942f3c","#2f4f80","#386148","#624075","#c19548","#22272e","#b5b8b1","#996139","#1d6372","#9b5b69","#4d5435","#d7b878"];
const groups=[["shape","방패","방패 형태를 선택하세요."],["symbol","상징","중앙 상징을 선택하세요."],["pattern","패턴","문장 배경 패턴을 선택하세요."],["colors","색상","배경과 문양의 색상을 선택하세요."]];
let state={shape:"shield",symbol:"swords",pattern:"solid",base:colors[0],accent:colors[4]},tab="shape";
const $=id=>document.getElementById(id);
function makeButton(item,field){const b=document.createElement("button");b.className="option"+(state[field]===item[0]?" active":"");b.innerHTML='<span class="glyph">'+item[2]+'</span><span>'+item[1]+'</span>';b.onclick=()=>{state[field]=item[0];render()};return b}
function render(){ $("previewName").textContent=$("guildName").value||"원정단 이름";$("tabs").innerHTML="";groups.forEach(g=>{let b=document.createElement("button");b.className="tab"+(tab===g[0]?" active":"");b.textContent=g[1];b.onclick=()=>{tab=g[0];render()};$("tabs").appendChild(b)});$("edtitle").textContent=groups.find(x=>x[0]===tab)[2];let out=$("choices");out.innerHTML="";if(tab==="colors"){[["base","배경 색상"],["accent","문양 색상"]].forEach(pair=>{const label=document.createElement("p");label.textContent=pair[1];label.style.cssText="font-size:13px;color:#d5bc88;margin:14px 0 0";out.appendChild(label);const grid=document.createElement("div");grid.className="swatches";colors.forEach(c=>{const b=document.createElement("button");b.className="swatch"+(state[pair[0]]===c?" active":"");b.style.background=c;b.title=c;b.onclick=()=>{state[pair[0]]=c;render()};grid.appendChild(b)});out.appendChild(grid)})}else{const grid=document.createElement("div");grid.className="options";(tab==="shape"?shapes:tab==="symbol"?symbols:patterns).forEach(item=>grid.appendChild(makeButton(item,tab)));out.appendChild(grid)}draw()}
function draw(){const canvas=$("crest"),ctx=canvas.getContext("2d");ctx.clearRect(0,0,128,128);ctx.imageSmoothingEnabled=false;const paths={shield:[[64,8],[111,22],[105,78],[91,100],[64,119],[37,100],[23,78],[17,22]],round:[[64,8],[91,15],[111,37],[120,64],[111,91],[91,113],[64,120],[37,113],[17,91],[8,64],[17,37],[37,15]],point:[[16,12],[112,12],[106,79],[64,121],[22,79]],diamond:[[64,5],[123,64],[64,123],[5,64]],banner:[[22,8],[106,8],[106,119],[64,99],[22,119]],wide:[[64,7],[104,12],[119,44],[108,97],[64,121],[20,97],[9,44],[24,12]],tower:[[17,10],[36,10],[36,18],[53,18],[53,10],[75,10],[75,18],[92,18],[92,10],[111,10],[111,96],[64,121],[17,96]],crest:[[16,12],[37,12],[64,6],[91,12],[112,12],[108,81],[64,121],[20,81]]};let p=paths[state.shape],poly=()=>{ctx.beginPath();p.forEach((pt,i)=>i?ctx.lineTo(...pt):ctx.moveTo(...pt));ctx.closePath()};ctx.save();ctx.shadowColor="#000";ctx.shadowBlur=12;poly();ctx.fillStyle="#0c1018";ctx.fill();ctx.shadowBlur=0;ctx.lineWidth=6;ctx.strokeStyle="#bb9050";ctx.stroke();ctx.lineWidth=2;ctx.strokeStyle="#efc982";ctx.stroke();ctx.clip();ctx.fillStyle=state.base;ctx.fillRect(0,0,128,128);ctx.globalAlpha=.45;ctx.fillStyle=state.accent;if(state.pattern==="split")ctx.fillRect(64,0,64,128);if(state.pattern==="horizontal")ctx.fillRect(0,64,128,64);if(state.pattern==="diagonal"){ctx.beginPath();ctx.moveTo(0,128);ctx.lineTo(128,0);ctx.lineTo(128,40);ctx.lineTo(40,128);ctx.fill()}if(state.pattern==="cross"){ctx.fillRect(52,0,24,128);ctx.fillRect(0,52,128,24)}if(state.pattern==="chevron"){ctx.beginPath();ctx.moveTo(0,30);ctx.lineTo(64,80);ctx.lineTo(128,30);ctx.lineTo(128,56);ctx.lineTo(64,106);ctx.lineTo(0,56);ctx.fill()}if(state.pattern==="quarters"){ctx.fillRect(0,0,64,64);ctx.fillRect(64,64,64,64)}if(state.pattern==="stripe")for(let i=0;i<128;i+=28)ctx.fillRect(i,0,13,128);ctx.globalAlpha=1;ctx.restore();
ctx.save();ctx.translate(64,63);ctx.fillStyle=state.accent;ctx.strokeStyle="#171a20";ctx.lineWidth=2;ctx.lineJoin="round";const polygon=(pts)=>{ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fill();ctx.stroke()};
function blade(a){ctx.save();ctx.rotate(a);polygon([[0,-42],[7,-30],[5,17],[-5,17],[-7,-30]]);ctx.fillRect(-18,16,36,6);ctx.fillRect(-4,20,8,21);ctx.restore()}
switch(state.symbol){case"swords":blade(-.7);blade(.7);break;case"crown":polygon([[-34,-19],[-23,15],[0,-25],[23,15],[34,-19],[28,28],[-28,28]]);ctx.fillRect(-28,28,56,7);break;case"tower":polygon([[-26,-33],[-16,-33],[-16,-23],[-5,-23],[-5,-33],[5,-33],[5,-23],[16,-23],[16,-33],[26,-33],[26,28],[-26,28]]);ctx.fillStyle=state.base;ctx.fillRect(-5,6,10,22);break;case"star":polygon(Array.from({length:10},(_,i)=>{let a=i*Math.PI/5-Math.PI/2,r=i%2?17:42;return[Math.cos(a)*r,Math.sin(a)*r]}));break;case"moon":ctx.beginPath();ctx.arc(0,0,37,0,7);ctx.fill();ctx.fillStyle=state.base;ctx.beginPath();ctx.arc(16,-12,31,0,7);ctx.fill();break;case"flame":polygon([[0,-43],[14,-17],[10,1],[29,-10],[26,24],[5,40],[-20,30],[-29,5],[-15,-15],[-13,8]]);break;case"skull":ctx.beginPath();ctx.arc(0,-10,29,0,7);ctx.fill();ctx.fillRect(-18,4,36,25);ctx.fillStyle=state.base;ctx.fillRect(-17,-11,12,12);ctx.fillRect(5,-11,12,12);break;case"tree":ctx.fillRect(-7,6,14,34);polygon([[0,-40],[-32,3],[32,3]]);polygon([[0,-22],[-34,18],[34,18]]);break;case"wing":polygon([[-5,0],[-42,-30],[-28,4],[-39,18],[-10,11],[5,33],[10,11],[39,18],[28,4],[42,-30],[5,0]]);break;case"cross":ctx.fillRect(-10,-38,20,76);ctx.fillRect(-35,-9,70,18);break;case"sun":ctx.beginPath();ctx.arc(0,0,19,0,7);ctx.fill();for(let i=0;i<12;i++){ctx.save();ctx.rotate(i*Math.PI/6);ctx.fillRect(-4,-42,8,13);ctx.restore()}break;case"gem":polygon([[0,-43],[36,0],[0,43],[-36,0]]);break}ctx.restore();ctx.save();ctx.strokeStyle="#f5ce7f";ctx.globalAlpha=.45;ctx.lineWidth=1;ctx.translate(64,64);ctx.strokeRect(-47,-47,94,94);ctx.restore()}
$("guildName").addEventListener("input",render);$("reset").onclick=()=>{state={shape:"shield",symbol:"swords",pattern:"solid",base:colors[0],accent:colors[4]};$("guildName").value="검은 새벽";tab="shape";$("result").style.display="none";render()};$("create").onclick=()=>{let n=$("guildName").value.trim();if(!n){alert("원정단 이름을 입력하세요.");return}let r=$("result");r.style.display="block";r.innerHTML="<strong>원정단 문장 실험 결과</strong><div>"+n.replace(/[&<>"]/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[s]))+"</div><small>선택한 문장을 확인했습니다. 실제 원정단은 생성되지 않았습니다.</small><br><button id='save'>문장 PNG 저장</button>";$("save").onclick=()=>{const a=document.createElement("a");a.download="guild-crest.png";a.href=$("crest").toDataURL("image/png");a.click()};r.scrollIntoView({behavior:"smooth",block:"nearest"})};render();
</script></body></html>
