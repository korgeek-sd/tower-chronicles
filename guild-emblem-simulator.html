<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>탑의 기록 | 원정단 문장 실험실</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d13;color:#ded4bd;font-family:"Malgun Gothic",system-ui,sans-serif}.shell{max-width:520px;min-height:100vh;margin:auto;background:linear-gradient(#19222e,#11161e 400px,#151a21);box-shadow:0 0 70px #000}header{display:flex;justify-content:space-between;align-items:center;padding:18px 18px 10px;border-bottom:1px solid #5f4d32}h1{margin:0;font-family:serif;font-size:27px;color:#eed59a;letter-spacing:2px}small,.sub{color:#a6a196}.back{background:#252a33;border:1px solid #8e754b;color:#ebce91;border-radius:5px;padding:9px 13px}.sub{text-align:center;font-size:12px;padding:13px}.stage{padding:12px 14px 0}.preview{min-height:250px;border:1px solid #665338;background:radial-gradient(ellipse at center,#2c3644,#171e29 65%);position:relative;overflow:hidden;text-align:center}.preview:before,.preview:after{content:"⚜";font-size:60px;color:#695535;position:absolute;top:70px;opacity:.5}.preview:before{left:18px}.preview:after{right:18px}#crest{width:196px;height:196px;display:block;margin:4px auto -6px;image-rendering:pixelated}#previewName{font-size:20px;color:#f6dfab;font-weight:700;padding:8px}.nameblock{display:flex;align-items:center;gap:10px;margin:15px 0}.nameblock label{white-space:nowrap;color:#e1c899;font-weight:bold;font-size:13px}.nameblock input{background:#111820;border:1px solid #756041;border-radius:4px;color:#f3e8d3;padding:12px;min-width:0;flex:1;font-size:16px}.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}.tab{font-size:12px;background:#222831;color:#b5ac9b;border:1px solid #4b5059;padding:13px 1px;font-weight:bold;cursor:pointer}.tab.active{background:#735b36;border-color:#e6bf76;color:#fff0c8}.editor{background:#1b2029;border:1px solid #554a37;padding:14px 12px 20px;min-height:267px}.edtitle{font-size:13px;color:#e4c88e;margin:0 0 14px}.options{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.option{background:#292f38;border:1px solid #50535a;min-height:77px;border-radius:3px;color:#d8c9a7;cursor:pointer;padding:9px 3px}.option .glyph{display:block;font-size:28px;height:39px;line-height:38px}.option span:last-child{font-size:12px}.option.active{background:#514330;border-color:#eccb81;box-shadow:inset 0 0 0 1px #e9c17a}.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:9px;margin:10px 0 20px}.swatch{border:2px solid #42474d;height:35px;border-radius:3px;cursor:pointer}.swatch.active{border:3px solid #ffe4a0;outline:1px solid #fff}.footer{display:flex;gap:12px;padding:16px 14px 22px}.footer button{padding:15px 4px;border-radius:5px;font-size:15px;font-weight:800;cursor:pointer}.secondary{width:36%;background:#343944;border:1px solid #8c8c93;color:#efeadb}.primary{flex:1;background:linear-gradient(#e3c27c,#b98c45);color:#25190c;border:1px solid #ffda93}.notice{margin:0;padding:0 16px 24px;text-align:center;color:#98999a;font-size:12px}#result{display:none;background:#1e252e;border:1px solid #a68b58;margin:0 14px 14px;padding:16px;text-align:center;line-height:1.8}#result button{background:#3b4450;color:white;padding:7px 15px;border:1px solid #8e774e}button:focus-visible,input:focus-visible{outline:2px solid #edc77e}@media(max-width:350px){h1{font-size:22px}.option{min-height:69px}}
</style></head><body><div class="shell"><header><button class="back" id="backToGame">‹</button><h1>원정단 창설</h1><button class="back" id="help">?</button></header><div class="sub">원정단의 이름과 문장을 직접 정하세요.</div><main class="stage"><div class="preview"><canvas id="crest" width="128" height="128"></canvas><div id="previewName">검은 새벽</div></div><div class="nameblock"><label for="guildName">원정단 이름</label><input id="guildName" maxlength="12" value="검은 새벽"></div><div class="tabs" id="tabs"></div><section class="editor"><p class="edtitle" id="edtitle"></p><div id="choices"></div></section></main><div class="footer"><button class="secondary" id="reset">↻ 초기화</button><button class="primary" id="create">⚑ 원정단 창설</button></div><div id="result"></div><p class="notice">독립 실험 페이지 · 실제 게임 계정과 서버에는 저장되지 않습니다.</p></div><script type="module" src="./guild-emblem-simulator.js"></script></body></html>
